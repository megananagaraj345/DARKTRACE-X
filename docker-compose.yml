services:

  postgres:
    image: postgres:16
    container_name: darktracex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darktracex
      POSTGRES_PASSWORD: darktracex_password
      POSTGRES_DB: darktracex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: darktracex-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/darktracex_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: